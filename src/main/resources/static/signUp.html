<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="signUp.css">
</head>
<body>

    <div class="container">
        <div class="card">
            <h2>Sign Up</h2>
            <form id="signUpForm">
                <h3>Username:</h3>
                <input type="text" id="username" name="username" placeholder="Enter your username" required>
                <h3>Mpin:</h3>
                <input type="password" id="mpin" name="password" placeholder="Enter your mpin" required><br><br>
                <button type="submit">Sign Up</button>
            </form>
        </div>
    </div>
    <script src="signUp.js"></script>
</body>
</html>
